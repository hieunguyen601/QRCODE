<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>QR code component</title>

</head>
<body>
  <div class="qrCode-component">
    <img class="qrCode" src="./images/image-qr-code.png" alt="QR Code">

    <p class="purpose">Improve your front-end skills by building projects</p>
    <p class="instruction">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>

</body>
</html>
